<!-- Nexovia favicon.

     This file sits at the SITE ROOT deliberately. Search engines and most
     crawlers request /favicon.ico and /favicon.svg by convention, ignoring the
     <link rel="icon"> in the document head — so whatever lives here is what
     shows up beside the search result, regardless of what Base.astro says.

     Until 2026-08-22 this path held Astro's scaffold favicon, committed with
     the very first commit and never replaced. The site linked the correct mark
     at /assets/img/favicon.svg, but Google asked the root for /favicon.ico,
     got Astro's logo, and published that next to the company name.

     Square on purpose. The brand mark's own viewBox is 214x271, and a
     non-square favicon gets letterboxed or squashed; Google asks for a square
     at a multiple of 48px. The mark is centred on a 512 square here, on the
     page ground, so it reads on both light and dark search UIs. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="nx" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5CFFB0"/>
      <stop offset="0.5" stop-color="#00FF88"/>
      <stop offset="1" stop-color="#00D873"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#05070a"/>
  <g transform="translate(110.7 76.8) scale(1.199)">
    <path fill-rule="nonzero" fill="url(#nx)" d="M24.70 24.30L32.20 24.30L217.70 197.80L217.70 274.50L24.70 99.50Z M217.50 38.90L217.50 168.00L174.20 128.50L174.20 80.80Z M26.10 260.50L26.10 129.30L71.60 170.20L71.60 218.70Z"/>
  </g>
</svg>
